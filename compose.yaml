# 一個指令啟動全系統：docker compose up -d --build（說明見 docs/deploy.md）
# 帳密從 .env 讀（複製 .env.example 後填）；連接埠只綁本機。
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-g4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請先複製 .env.example 成 .env 並設定 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-g4}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    env_file: .env
    environment:
      # 容器內連資料庫要用服務名 db 與內部埠 5432，覆蓋 .env 裡給本機用的 DATABASE_URL
      DATABASE_URL: postgresql://${POSTGRES_USER:-g4}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-g4}
      # 容器版一定有資料庫，固定用 pg（本機直接跑 uv run 時才看 .env 的 CATALOG_SOURCE／STORE）
      CATALOG_SOURCE: pg
      STORE: pg
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dbdata:
